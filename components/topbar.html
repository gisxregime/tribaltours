<header class="sticky top-0 z-30 border-b border-[#e9e4d9] bg-white/90 backdrop-blur">
    <div class="px-4 md:px-6 py-3 flex items-center justify-between gap-4">
        <div class="flex items-center gap-3 min-w-0">
            <button type="button" class="lg:hidden inline-flex h-9 w-9 items-center justify-center rounded-lg border border-[#e2dccf] text-[#4f4535]" @click="sidebarOpen = true">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="min-w-0">
                <p class="text-xs uppercase tracking-[0.18em] text-[#9a8f79] font-semibold">Guide Workspace</p>
                <h1 class="text-lg md:text-2xl font-bold text-[#1d1a14] truncate">{{PAGE_TITLE}}</h1>
            </div>
        </div>

        <div class="hidden xl:flex items-center flex-1 max-w-xl mx-4">
            <div class="w-full flex items-center rounded-2xl border border-[#e5dfd2] bg-[#f8f6f0] px-3 py-2">
                <i class="fa-solid fa-magnifying-glass text-[#8a7f6a] mr-2"></i>
                <input type="text" placeholder="Search tours, requests, messages" class="w-full bg-transparent outline-none text-sm text-[#2a261d] placeholder:text-[#a49781]">
            </div>
        </div>

        <div class="flex items-center gap-2" x-data="{open:false}">
            <button type="button" class="h-10 w-10 rounded-xl border border-[#e5dfd2] bg-[#f8f6f0] text-[#5f543f] hover:bg-[#efe9db]">
                <i class="fa-solid fa-bell"></i>
            </button>
            <button type="button" class="flex items-center gap-2 rounded-xl border border-[#e5dfd2] bg-[#f8f6f0] px-2.5 py-1.5 hover:bg-[#efe9db]" @click="open = !open">
                <img src="../images/manila.jpg" alt="Guide avatar" class="h-7 w-7 rounded-full object-cover">
                <span class="hidden md:block text-sm font-semibold text-[#433a2c]">Guide Name</span>
                <i class="fa-solid fa-chevron-down text-xs text-[#7a6f5d]"></i>
            </button>
            <div x-show="open" @click.outside="open=false" x-transition class="absolute right-4 top-14 w-48 rounded-xl border border-[#e4ddcf] bg-white shadow-lg p-2">
                <a href="profile.html" class="block rounded-lg px-3 py-2 text-sm text-[#4f4535] hover:bg-[#f3efe5]">View Profile</a>
                <a href="settings.html" class="block rounded-lg px-3 py-2 text-sm text-[#4f4535] hover:bg-[#f3efe5]">Settings</a>
                <a href="../index.html" class="block rounded-lg px-3 py-2 text-sm text-[#4f4535] hover:bg-[#f3efe5]">Logout</a>
            </div>
        </div>
    </div>
</header>
