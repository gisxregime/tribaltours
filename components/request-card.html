<article class="rounded-2xl border border-[#e7e1d5] bg-white shadow-sm p-4">
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-3">
            <img src="../images/39.jpg" alt="Tourist avatar" class="h-10 w-10 rounded-full object-cover">
            <div>
                <p class="font-semibold text-[#241f18]">{{TOURIST_NAME}}</p>
                <p class="text-xs text-[#8a7f6a]">{{DATE}} • {{GUESTS}}</p>
            </div>
        </div>
        <span class="rounded-full bg-[#f4efdf] text-[#8b6d2d] text-xs px-2.5 py-1 font-semibold">{{STATUS}}</span>
    </div>
    <h4 class="mt-3 text-base font-semibold text-[#241f18]">{{TOUR_TITLE}}</h4>
    <p class="mt-1 text-sm text-[#6f6553]">{{MESSAGE_PREVIEW}}</p>
    <div class="mt-4 flex items-center justify-between">
        <p class="text-lg font-bold text-[#1f1a12]">{{PRICE}}</p>
        <div class="flex gap-2">
            <button class="rounded-xl bg-[#5f7f37] px-3 py-2 text-white text-sm font-semibold">Accept</button>
            <button class="rounded-xl border border-[#e0d9ca] bg-white px-3 py-2 text-[#564c3a] text-sm font-semibold">Decline</button>
        </div>
    </div>
</article>
